<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070707">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JOURNAL">
<title>ISIONXXX // JOURNAL</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="ui.css">
<style>
:root{
  color-scheme:dark;
  --bg:#070707;--panel:#0c0c0c;--line:#1c1c1c;--line2:#2c2c2c;
  --tx:#d9d5c8;--dim:#8f8a7e;--amber:#ffb000;--green:#33ff66;--red:#ff4545;
  --f:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0 auto;max-width:1440px;padding:calc(env(safe-area-inset-top) + 14px) 16px 48px;background:var(--bg);color:var(--tx);font:13px/1.45 var(--f);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line2);border-radius:0;padding:7px 10px;outline:0}
button{cursor:pointer;font-size:12px;letter-spacing:.06em}
button:hover,select:hover{border-color:var(--amber);color:var(--amber)}
:focus-visible{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.pri{background:var(--amber);border-color:var(--amber);color:#000;font-weight:600}
.pri:hover{color:#000;filter:brightness(1.12)}
.pos{color:var(--green)}
/* trade side: only the arrow is coloured, long green and short red (the word stays for colour-blind reading) */
.sd-l{color:var(--green)}.sd-s{color:#ff6b6b}.neg{color:var(--red)}.dim{color:var(--dim)}.amb{color:var(--amber)}
.bgp{background:var(--green)}.bgn{background:var(--red)}.bgd{background:var(--line2)}.bgm{background:var(--dim)}
.r{text-align:right}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{font-weight:600;font-size:15px;letter-spacing:.14em}
.brand b{color:var(--amber)}
.cur{display:inline-block;width:.6em;height:1.05em;margin-left:6px;background:var(--amber);vertical-align:-2px;animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.cur{animation:none}}
.acts,.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{padding:14px 0}

.g{display:grid;gap:12px;margin-bottom:12px}
.g4{grid-template-columns:repeat(4,1fr)}.g21{grid-template-columns:2fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--panel);border:1px solid var(--line);padding:16px;min-width:0}
.h{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin-bottom:12px}
.h::before{content:'> ';color:var(--dim)}
.k{font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.big{font-size:22px;font-weight:600;margin:2px 0 8px}
.rowh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.empty{margin-bottom:12px;border-color:var(--amber)}
.empty p+p{margin-bottom:12px}

.gauge{display:block;width:150px;max-width:100%;margin:6px auto 10px}
.gauge path{fill:none;stroke-width:9}
.s0{stroke:var(--line2)}.sg{stroke:var(--green)}.sr{stroke:var(--red)}.sd{stroke:var(--dim)}
.gauge text{fill:var(--tx);font:600 17px var(--f)}
.lg{display:grid;grid-template-columns:14px 1fr auto 46px;align-items:center;padding:2px 0}
.lg em{font-style:normal;color:var(--dim);text-align:right}
.dot{display:inline-block;width:7px;height:7px}
.ev{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0}
.ev.rule{border-top:1px solid var(--line);margin-top:4px;padding-top:10px}
.hb{height:20px;background:#111;margin:2px 0 10px}
.hb i{display:block;height:100%}
.sec{font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;margin:12px 0 4px;padding-top:12px;border-top:1px solid var(--line)}
.sec.first{border:0;margin-top:0;padding-top:0}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,.9fr);gap:4px}
.dw{font-size:11px;color:var(--dim);text-align:center;padding:4px 0;letter-spacing:.08em;text-transform:uppercase}
.cd{min-height:66px;padding:6px;border:1px solid var(--line);background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;letter-spacing:0;color:var(--dim);overflow:hidden}
.cd b{font-size:12px}.cd em{font-style:normal;font-size:10px}
.cd.we,.cd.off{background:repeating-linear-gradient(135deg,#0a0a0a 0 6px,#111 6px 7px)}
.cd.off{border-color:transparent;opacity:.5}
.cd.p{background:rgba(51,255,102,.07);border-color:rgba(51,255,102,.3)}
.cd.n{background:rgba(255,69,69,.08);border-color:rgba(255,69,69,.3)}
.cd.now span{color:var(--amber)}
.cd.sel{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.cd.wk{border-style:dashed}
.calf{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}

.eqs{display:flex;gap:22px;flex-wrap:wrap}
.eqs div{display:flex;flex-direction:column;gap:2px}
.chart{display:block;width:100%;height:160px}
.cap{font-size:10.5px;color:var(--dim);margin-top:6px;letter-spacing:.04em}
.chart *{vector-effect:non-scaling-stroke}
.chart .ln{fill:none;stroke-width:1.5}
.hl{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-top:4px}
.chart .z{stroke:var(--line2);stroke-dasharray:4 4}
.cg .ln{stroke:var(--green)}.cg .ar{fill:rgba(51,255,102,.1)}
.cr .ln{stroke:var(--red)}.cr .ar{fill:rgba(255,69,69,.1)}
.fp{fill:var(--green)}.fn{fill:var(--red)}.fa{fill:var(--amber)}
/* cross-filters: anything with .pick narrows every card and the log; the filters show as chips under the bar */
.pick{cursor:pointer}.pick:focus-visible{outline:1px solid var(--amber);outline-offset:2px}
.lg.pick,.ev.pick{margin:0 -6px;padding-left:6px;padding-right:6px}.lg.pick:hover,.ev.pick:hover,.hb.pick:hover{background:#121212}
.lg.on,.ev.on{background:#1a1406;box-shadow:inset 2px 0 0 var(--amber)}
.gauge path.pick:hover{filter:brightness(1.3)}.gauge path.off,.chart .off{opacity:.25}
.chart rect.pick:hover{filter:brightness(1.35)}.chart .hit{fill:transparent}.chart .hit:hover{fill:rgba(255,176,0,.08)}
.xf{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-4px 0 12px}
.xf span{color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-right:2px}
.xf button{border-color:var(--amber);color:var(--amber);padding:5px 8px}.xf button b{font-weight:600}.xf .clr{border-color:var(--line2);color:var(--dim)}
.nd{height:160px;display:grid;place-items:center;color:var(--dim);letter-spacing:.14em;font-size:11px}
.radar{display:block;width:100%;max-width:230px;margin:0 auto}
.radar .rg{fill:none;stroke:var(--line2)}
.radar .rv{fill:rgba(255,176,0,.16);stroke:var(--amber);stroke-width:1.5}
.radar text{fill:var(--dim);font:10px var(--f);letter-spacing:.08em}

.tw{overflow-x:auto;position:relative}
table{width:100%;min-width:940px;border-collapse:collapse}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;font-weight:500;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
th.r,td.r{text-align:right}
td button{padding:2px 7px;font-size:11px}
footer{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px;font-size:11px;color:var(--dim)}
footer select,footer button{padding:3px 8px;font-size:11px}

dialog{background:var(--panel);color:var(--tx);border:1px solid var(--amber);padding:20px;width:min(560px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(0,0,0,.78)}
dialog h3{margin:0 0 14px;font-size:13px;letter-spacing:.14em;color:var(--amber)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
label input,label select,label textarea,dialog textarea{width:100%;font-size:13px;letter-spacing:0;text-transform:none;color:var(--tx)}
textarea{resize:vertical}
.fa2{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:14px}
/* daily review: a script to read top to bottom */
dialog.rvd{width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
.rvh{display:flex;align-items:center;gap:8px;margin-bottom:6px}.rvh h3{margin:0;flex:1}
.rv{border-top:1px solid var(--line);padding:14px 0 4px;font-size:14px;line-height:1.7}
.rv h4{margin:0 0 6px;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.rv p{margin:0 0 8px}.rv b{font-weight:600}.rv q{color:var(--dim);font-style:italic}
.rv ol,.rv ul{margin:0 0 8px;padding-left:22px}.rv li{margin:0 0 6px}.rv li::marker{color:var(--dim)}
.rv .tr{display:block;color:var(--dim);font-size:12px}
.rv blockquote{margin:0 0 8px;padding:2px 0 2px 12px;border-left:2px solid var(--amber);white-space:pre-wrap}
.fa2 span{margin-right:auto}
/* pre-market plan: the review's sections, plus the max-loss field, the focus rule and a checklist to tick */
.pm-ml{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pm-ml label{display:inline;font-size:inherit;letter-spacing:0;text-transform:none;color:var(--tx)}
.pm-ml span{display:inline-flex;align-items:center;gap:4px}.pm-ml input{width:120px}
.pm-f{font-size:15px}.rvh h3:focus{outline:0;box-shadow:none}.ui-set input[data-f]{width:110px;flex:none}
.pm-r{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.pm-r span{flex:1 1 260px}.pm-r button{flex:none;padding:4px 10px;font-size:11px}
.pm-ck{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 8px}
.pm-ck label{flex-direction:row;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--g-line2);border-radius:var(--g-r3);background:rgba(255,255,255,.035);font-size:13px;letter-spacing:0;text-transform:none;color:var(--tx);cursor:pointer}
.pm-ck label:has(:checked){border-color:rgba(255,176,0,.45);background:rgba(255,176,0,.07)}.pm-ck label:has(:focus-visible){border-color:var(--amber)}
.pm-ck input{width:16px;height:16px;margin:0;padding:0;flex:none;accent-color:var(--amber);box-shadow:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:90vw;background:var(--panel);border:1px solid var(--amber);color:var(--amber);padding:8px 14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}

@media(max-width:1000px){.g4{grid-template-columns:1fr 1fr}.g21,.g3{grid-template-columns:1fr}}
@media(max-width:560px){
  body{padding-left:10px;padding-right:10px}
  .g4,.fgrid{grid-template-columns:1fr}
  .cd{min-height:50px;padding:3px}.cd em{display:none}.cd b{font-size:10px}
  .eqs{gap:14px}
  .pm-ck{grid-template-columns:1fr}
}
h1.brand{margin:0}
</style>
</head>
<body>
<header class="top">
  <h1 class="brand">ISIONXXX <b>//</b> JOURNAL<i class="cur"></i></h1>
  <div class="acts">
    <button class="pri" data-a="add">+ TRADE</button>
    <button data-a="plan">PLAN</button>
    <button data-a="note">NOTES</button>
    <button data-a="review" data-more>REVIEW</button>
    <button data-a="imp" data-more>IMPORT</button>
    <button data-a="set" data-more>SETTINGS</button>
    <input id="file" type="file" accept=".csv,.json,text/csv,application/json" hidden>
  </div>
</header>
<div id="top"></div>
<div class="bar">
  <select data-f="acct" aria-label="Account"></select>
  <select data-f="stat" aria-label="Outcome">
    <option value="all">All outcomes</option><option value="win">Wins</option><option value="be">Breakeven</option><option value="loss">Losses</option>
  </select>
  <select data-f="range" aria-label="Range"></select>
  <span id="scope" class="dim"></span>
</div>
<div id="xf" class="xf" hidden></div>
<main id="app"></main>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script src="sync.js" data-keys="isx.journal.v1"></script>
<script src="ui.js"></script>
<script>
'use strict';
const KEY='isx.journal.v1', PAGE=20;
// dollars per 1.00 point, per contract
const SPEC={NQ:20,MNQ:2,ES:50,MES:5,YM:5,MYM:.5,RTY:50,M2K:5,GC:100,MGC:10,SI:5000,SIL:1000,HG:25000,CL:1000,MCL:100,NG:10000};
const RANGES={today:'Today',week:'This week',month:'This month',all:'All time'};
const ALIAS={
  close:['closed','close','time','time (local)','exit time','exittime','exitedat','closed at','date','sold timestamp'],
  open:['opened','open','entry time','entrytime','enteredat','opened at','bought timestamp'],
  account:['account','account name','accountname'],
  contract:['contract','symbol','instrument','contractname'],
  side:['side','type','direction'],
  qty:['qty','quantity','size','contracts'],
  entry:['entry','entry price','entryprice','buy price','avg entry'],
  exit:['exit','exit price','exitprice','sell price','avg exit'],
  mult:['multiplier','point value','mult'],
  fee:['fee','fees'],comm:['comm','commission','commissions'],
  dur:['duration'],note:['note','notes','comment']
};

const $=s=>document.querySelector(s), dlg=$('#dlg');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const r2=v=>Math.round(v*100)/100;
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addd=(s,k)=>{const d=pd(s);d.setDate(d.getDate()+k);return ymd(d)};
const dtl=ms=>{const d=new Date(ms);return `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`};
// formatters made once: toLocaleString builds a new one on every call, which adds up over long tables and charts
const FMT={dmy:new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric'}),dt:new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}),
  n0:new Intl.NumberFormat('en-US',{maximumFractionDigits:0}),n1:new Intl.NumberFormat('en-US',{maximumFractionDigits:1}),n2:new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})};
const dlabel=s=>FMT.dmy.format(pd(s));
const tfmt=ms=>FMT.dt.format(ms);
const usd=(v,plus)=>(v<0?'-':plus&&v>0?'+':'')+'$'+FMT.n2.format(Math.abs(v));
const usd0=v=>(v<0?'-':'')+'$'+Math.abs(Math.round(v)).toLocaleString('en-US');
const px=v=>{const s=String(v);return s.includes('.')&&s.split('.')[1].length>2?s:v.toFixed(2)};
const cls=v=>v>0?'pos':v<0?'neg':'dim';
const dur=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}h ${m}m`:m?`${m}m ${x}s`:`${x}s`};
const root=c=>String(c).toUpperCase().trim().replace(/\d*!$/,'').replace(/[FGHJKMNQUVXZ]\d{1,2}$/,'');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
// net P&L: points x direction x qty x $/point, minus fee and commission
const net=t=>r2((t.exit-t.entry)*(t.side==='Short'?-1:1)*t.qty*t.mult-t.fee-t.comm);

/* ---------- state ---------- */
let S=load();
const U={acct:'all',stat:'all',range:'all',page:0,month:null,x:{}};   // x: cross-filters set by clicking a card (dres, hour, wd, inst, side)
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.trades))return state(s)}catch(e){}
  return state({});
}
// plans: the pre-market plan of each trading day; maxLoss: the daily stop from Settings (null: from my red days)
function state(s){return {trades:s.trades||[],notes:s.notes||{},roll:s.roll??18,plans:s.plans||{},maxLoss:s.maxLoss>0?s.maxLoss:null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));UI.replan()}catch(e){toast('Storage write failed — take a backup')}}
// trading day: anything at/after the roll hour belongs to the next date (Sunday 6 PM open -> Monday)
function tday(ms){const d=new Date(ms);if(S.roll&&d.getHours()>=S.roll)d.setDate(d.getDate()+1);return ymd(d)}
function setMonth(ms){const d=pd(tday(ms));U.month={y:d.getFullYear(),m:d.getMonth()}}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3200)}

// skip leaves one filter out: a card that sets a filter shows everything else, with its own choice highlighted
const res=v=>v>0?'win':v<0?'loss':'be',ohr=t=>new Date(t.open||t.close).getHours(),owd=t=>new Date(t.open||t.close).getDay();
function view(useRange=true,skip=''){
  const today=tday(Date.now()),wk=s=>{const d=pd(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return ymd(d)}   /* trading week: Monday first */;
  const inR=d=>U.range==='all'||(U.range==='today'?d===today:U.range==='week'?wk(d)===wk(today):U.range==='month'?d.slice(0,7)===today.slice(0,7):d===U.range);
  const x=U.x,on=k=>k!==skip&&x[k]!=null;
  let T=S.trades.map(t=>({...t,pnl:net(t),day:tday(t.close)}))
    .filter(t=>(U.acct==='all'||t.account===U.acct)&&(skip==='stat'||U.stat==='all'||res(t.pnl)===U.stat)&&(!useRange||inR(t.day))
      &&(!on('hour')||ohr(t)===x.hour)&&(!on('wd')||owd(t)===x.wd)&&(!on('inst')||root(t.contract)===x.inst)&&(!on('side')||t.side===x.side));
  // green / red / flat days: decided by the day's net over the trades the other filters leave
  if(on('dres')){const D={};T.forEach(t=>D[t.day]=(D[t.day]||0)+t.pnl);T=T.filter(t=>res(r2(D[t.day]))===x.dres)}
  return T.sort((a,b)=>a.close-b.close);
}

function stats(T){
  const n=T.length,W=T.filter(t=>t.pnl>0),L=T.filter(t=>t.pnl<0);
  const gp=r2(W.reduce((s,t)=>s+t.pnl,0)),gl=r2(-L.reduce((s,t)=>s+t.pnl,0)),tot=r2(gp-gl);
  const D={};T.forEach(t=>{D[t.day]??={pnl:0,n:0};D[t.day].pnl+=t.pnl;D[t.day].n++});
  const dk=Object.keys(D).sort(),dp=dk.map(k=>r2(D[k].pnl));
  let eq=0,peak=0,mdd=0,run=0,lw=0,ll=0;const curve=[0],under=[0];
  T.forEach(t=>{
    eq+=t.pnl;peak=Math.max(peak,eq);mdd=Math.max(mdd,peak-eq);curve.push(r2(eq));under.push(r2(eq-peak));
    const s=Math.sign(t.pnl);run=!s?0:Math.sign(run)===s?run+s:s;lw=Math.max(lw,run);ll=Math.max(ll,-run);
  });
  mdd=r2(mdd);
  const mean=dp.length?dp.reduce((a,b)=>a+b,0)/dp.length:0;
  const dev=dp.length>1?Math.sqrt(dp.reduce((s,x)=>s+(x-mean)**2,0)/(dp.length-1)):0;
  const dn=dp.length>1?Math.sqrt(dp.reduce((s,x)=>s+Math.min(x,0)**2,0)/dp.length):0;
  const aw=W.length?gp/W.length:0,al=L.length?gl/L.length:0,pf=gl?gp/gl:gp?Infinity:null,wr=n?W.length/n*100:0;
  // score axes, each 0-100: payoff ratio (2.0 = full), win rate, profit factor (2.0 = full)
  const axes=[Math.min((al?aw/al:aw?2:0)/2,1)*100,wr,Math.min((pf||0)/2,1)*100];
  return {n,w:W.length,l:L.length,be:n-W.length-L.length,gp,gl,tot,aw,al,pf,wr,exp:n?tot/n:0,
    best:n?Math.max(...T.map(t=>t.pnl)):0,worst:n?Math.min(...T.map(t=>t.pnl)):0,
    dk,dp,vol:dk.map(k=>D[k].n),dw:dp.filter(x=>x>0).length,dl:dp.filter(x=>x<0).length,avgDay:mean,

const ARC='M12 62A50 50 0 0 1 112 62', ND='<div class="nd">NO DATA_</div>';

function gauge(segs,label){

  return `<svg class="gauge" viewBox="0 0 124 70"><path class="s0" d="${ARC}"/>${arcs}<text x="62" y="60" text-anchor="middle">${label}</text></svg>`;
}
// a chart is ~600 px wide: more points than that only costs time and memory. Keep each bucket's low and high, in
// order, so peaks and drawdowns still show.
// long ranges: average runs of k neighbours so every bar or point stays readable on a phone (the newest run ends

const cap=(k,what='days')=>k>1?`<div class="cap">Each bar averages ${k} ${what}</div>`:'';
// at(i0,i1) → {a, title} for the stretch of points one column stands for: what clicking it does, what hovering says

const hit=m=>m?`${m.a?` class="hit pick" ${m.a}`:' class="hit"'}><title>${esc(m.title)}</title></path>`:' class="hit"/>';

  const x=i=>(p+i*(w-2*p)/(n-1)).toFixed(1),y=v=>(p+(hi-v)*(h-2*p)/rg).toFixed(1);
  const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const cw=(w-2*p)/(n-1),hits=at?vals.map((_,i)=>`<path d="M${Math.max(0,x(i)-cw/2).toFixed(1)} 0h${cw.toFixed(1)}v${h}h-${cw.toFixed(1)}z"${hit(at(...B.r[i]))}`).join(''):'';
  return `<svg class="chart ${c}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polygon class="ar" points="${x(0)},${y(0)} ${pts} ${x(n-1)},${y(0)}"/><line class="z" x1="0" x2="${w}" y1="${y(0)}" y2="${y(0)}"/><polyline class="ln" points="${pts}"/>${hits}</svg>`;
}
function bars(vals,signed,at){const B=bucket(vals,60);return bars0(B.v,signed,at&&(i=>at(...B.r[i])))+cap(B.k)}
function bars0(vals,signed,at){
  const w=600,h=160,p=6,n=vals.length;if(!n)return ND;
  const lo=Math.min(0,...vals),hi=Math.max(0,...vals),rg=hi-lo||1,step=(w-2*p)/n,bw=Math.min(180,step*.7);
  const y=v=>p+(hi-v)*(h-2*p)/rg;

  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${vals.map((v,i)=>{const m=at&&at(i);return `<rect class="${signed?(v<0?'fn':'fp'):'fa'}${m&&m.off?' off':''}" x="${(p+i*step+(step-bw)/2).toFixed(1)}" y="${Math.min(y(0),y(v)).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,Math.abs(y(v)-y(0))).toFixed(1)}"/>`+(m?`<path d="M${(p+i*step).toFixed(1)} 0h${step.toFixed(1)}v${h}h-${step.toFixed(1)}z"${hit(m)}`:'')}).join('')}<line class="z" x1="0" x2="${w}" y1="${y(0)}" y2="${y(0)}"/></svg>`;

function radar(ax,tips=[]){

function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function parseCSV(txt){
  const rows=[];let row=[],f='',q=false;
  const end=()=>{row.push(f);f='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]};
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;end()}else f+=c}
  end();return rows;
}
const num=s=>parseFloat(String(s).replace(/[$,+\s]/g,''));
// ISO, "2026-10-08 00:01:06", or US "10/08/2026 00:01:06" (Tradovate), all read as local time
const ts=s=>{
  const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})[ T](\d{1,2}):(\d\d)(?::(\d\d))?\s*(AM|PM)?$/i.exec(s.trim());
  if(m){let h=+m[4];if(m[7])h=h%12+(/pm/i.test(m[7])?12:0);return new Date(+m[3],m[1]-1,+m[2],h,+m[5],+(m[6]||0)).getTime()}
  return Date.parse(/^\d{4}-\d\d-\d\d \d/.test(s)?s.replace(' ','T'):s);
};
const secs=s=>{if(!s)return 0;if(/^[\d.]+$/.test(s))return +s;let x=0;s.replace(/([\d.]+)\s*([hms])/gi,(_,v,u)=>{x+=v*{h:3600,m:60,s:1}[u.toLowerCase()]});return x};
function importCSV(txt){

  // Whichever fill came first is the entry: bought first = long, sold first = short.
  const P=['buyprice','sellprice','boughttimestamp','soldtimestamp'].map(h=>H.indexOf(h)),perf=P.every(i=>i>=0);
  const miss=['close','contract','entry','exit'].filter(k=>c[k]<0&&!(perf&&k!=='contract'));

      side=short?'Short':'Long';entry=num(short?sp:bp);exit=num(short?bp:sp);op=Math.min(b,s);close=Math.max(b,s);
    }else{close=ts(g('close'));entry=num(g('entry'));exit=num(g('exit'));op=ts(g('open'));side=/short|sell/i.test(g('side'))?'Short':'Long'}
    if(!isFinite(close)||!isFinite(entry)||!isFinite(exit)||!contract){skip++;return}

function sample(){
  /* A profitable trader's last ~10 weeks on full-size futures: 200 trades in NQ, ES and GC (Dec '26), 1 contract,
     fixed risk 1R = $300 (NQ 15 pt x $20, ES 6 pt x $50, GC 3.0 x $100), winners taken at 3R, losers cut at 1R,
     some scratched at breakeven (net $0). Fees $5.00 a round trip (2.50 + 2.50).
     72 wins / 96 losses / 32 breakeven: 36% win rate (43% without breakevens), ~+0.6R a trade. The order comes from a
     fixed seed, so losing streaks and drawdowns look real and the sample is the same every time. */
  let seed=20261016;const rnd=()=>((seed=Math.imul(seed^seed>>>15,2246822507)^Math.imul(seed^seed>>>13,3266489909),(seed^=seed>>>16)>>>0)/4294967296);
  const pick=a=>a[Math.floor(rnd()*a.length)];
  const out=[...Array(72).fill('W'),...Array(96).fill('L'),...Array(32).fill('B')];
  for(let i=out.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[out[i],out[j]]=[out[j],out[i]]}
  // trading days: weekdays, ending today (on a weekend, Friday), 2–6 trades a day
  const days=[],d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+1);
  for(let left=out.length;left>0;){d.setDate(d.getDate()-1);if(d.getDay()===0||d.getDay()===6)continue;const n=Math.min(left,2+Math.floor(rnd()*5));days.unshift({d:new Date(d),n});left-=n}
  const NOTE={W:['A+ setup, held to target','Patience paid — waited for the retest','Trailed under structure, hit 3R'],L:['Stopped out, plan followed','Chased the entry — rule break','Fought the trend, should have waited'],B:['Moved stop to breakeven, got tagged','Scratched before the news']};
  // contract: [point value, stop in points, tick, starting price]
  const C={NQZ6:[20,15,.25,24800],ESZ6:[50,6,.25,6750],GCZ6:[100,3,.1,4150]},px={};for(const c in C)px[c]=C[c][3];
  const dec=c=>c==='GCZ6'?1:2,fix=(v,c)=>+v.toFixed(dec(c));
  let k=0;
  days.forEach(({d,n})=>{
    let t=new Date(d);t.setHours(9,30+Math.floor(rnd()*20),Math.floor(rnd()*60));
    for(let i=0;i<n;i++,k++){
      const r=out[k],x=rnd();
      // a breakeven exit sits one NQ tick in profit ($5.00), which pays the fees exactly, so it nets $0. ES and GC ticks
      // ($12.50, $10) can't land on the fee, so scratches are NQ trades
      const c=r==='B'||x<.5?'NQZ6':x<.8?'ESZ6':'GCZ6',[mult,stop,tick]=C[c],long=rnd()<.55;
      px[c]=fix(px[c]+Math.round((rnd()-.48)*stop*4/tick)*tick,c);
      const entry=px[c],move=r==='W'?stop*3:r==='L'?-stop:tick,exit=fix(entry+(long?move:-move),c);
      const held=(r==='W'?8+rnd()*35:r==='L'?2+rnd()*12:5+rnd()*15)*60e3,open=t.getTime(),close=open+Math.round(held);
      S.trades.push({id:uid(),account:'SAMPLE-50K',contract:c,side:long?'Long':'Short',qty:1,entry,exit,open,close,mult,fee:2.5,comm:2.5,note:rnd()<.18?pick(NOTE[r]):''});
      t=new Date(close+(10+rnd()*40)*60e3);
    }
  });
  // today's trades all closed before now: slide the day back to fit
  const now=Date.now(),mine=S.trades.filter(x=>x.account==='SAMPLE-50K'),late=Math.max(0,...mine.map(x=>x.close-now));
  if(late){const t0=new Date();t0.setHours(0,0,0,0);mine.forEach(x=>{if(x.open>=t0){x.open-=late+5*6e4;x.close-=late+5*6e4}})}
  save();boot();
}

  const gave=n>1&&peak>0?r2(peak-pnl):0;
  return {pnl,peak,pk,low,lsMax,gave,gaveBig:gave>=Math.max(100,peak*.25),hw:avg(T.filter(t=>t.pnl>0).map(mins)),hl:avg(T.filter(t=>t.pnl<0).map(mins)),
    fast:T.filter((t,i)=>i&&T.slice(0,i).some(x=>x.pnl<0&&t.open>=x.close&&t.open-x.close<=5*6e4)),over:an!=null&&an>=2&&n>=an*1.5};

  const fees=r2(T.reduce((a,t)=>a+t.fee+t.comm,0)),pts=t=>(t.exit-t.entry)*(t.side==='Short'?-1:1);
  const sec=(h,b)=>b?`<section class="rv"><h4>${h}</h4>${b}</section>`:'';

      `<p>${!(P.loss>0)?"I didn't set a max loss.":`My max loss was <b>${usd0(-P.loss)}</b>. `+(pnl<-P.loss?`I finished at ${$$(pnl)}: <b class="neg">past my max-loss line by ${usd(-P.loss-pnl)}</b>. I reached it on trade ${hit+1}${after}.`

      const k=Object.keys(D),v=r2(k.reduce((a,d)=>a+D[d],0));
      return {title:'Weekly review',sub:k.length?`This week ${v>0?'+':''}${usd0(v)} · ${pls(k.length,'day')} · ${k.filter(d=>D[d]>0).length} green`:'No trades this week · look back at my last day',act:'review'}}
    const P=premkt(day),p=S.plans[day],f=p||P.pick,loss=p?p.loss:P.loss;
    return {title:'Pre-market plan',sub:`Focus: ${f.short} · ${loss>0?'max −'+usd0(loss):'set a max loss'}`,act:'plan',done:!!p&&CHK.every(([k])=>p.ticks?.[k])};
  };
  const now=new Date();
  if(!S.roll||now.getHours()>=S.roll)return [row(+now)];
  const a=row(+now),b=row(new Date(now.getFullYear(),now.getMonth(),now.getDate(),S.roll).getTime());
  return !a||!b||JSON.stringify(a)===JSON.stringify(b)?[a||b]:[{...a,h0:0,h1:S.roll},b];
}

function settingsForm(){
  dlg.innerHTML=`<h3>SETTINGS</h3>
  <div class="ui-set">
    <div><span><b>Trading day</b><small>When a new trading day starts (local time)</small></span><select data-f="roll" aria-label="Trading day rollover">${[0,16,17,18].map(h=>`<option value="${h}"${h===S.roll?' selected':''}>${h?pad(h)+':00':'midnight'}</option>`).join('')}</select></div>
    <div><span><b>Daily max loss</b><small>Your stop for the day in the pre-market plan. Leave blank to use your median red day</small></span><input data-f="maxl" type="number" min="0" step="any" inputmode="decimal" placeholder="Auto" aria-label="Daily max loss in dollars" value="${S.maxLoss||''}"></div>
    <div><span><b>Sync</b><small>${window.ISXSync?.state==='ok'?'On · this app syncs across your devices':'Keep every app the same on all your devices'}</small></span><span class="ui-set-btns"><button type="button" data-a="sync">SYNC…</button></span></div>
    <div><span><b>Backup</b><small>Saved on this device. Download a copy, or restore one.</small></span><span class="ui-set-btns"><button type="button" data-a="bak">BACKUP JSON</button><button type="button" data-a="imp">RESTORE</button></span></div>
    <div><span><b>Delete everything</b><small>Removes all of this app's data on this device.</small></span><span class="ui-set-btns"><button type="button" class="ui-danger" data-a="clear">CLEAR ALL</button></span></div>
  </div>
  <div class="fa2"><button type="button" class="pri" data-a="x">DONE</button></div>`;
  dlg.showModal();
}
const ACT={
  set:()=>settingsForm(),sync:()=>{dlg.close();document.getElementById('isx-sync')?.click()},
  add:()=>tradeForm(),plan:()=>planForm(),imp:()=>$('#file').click(),x:()=>dlg.close(),sample,csv:exportCSV,
  note:()=>noteForm(U.range in RANGES?tday(Date.now()):U.range),
  review:()=>reviewForm(rvDefault()),rvgo:v=>v&&reviewForm(v),rvnote:v=>{dlg.classList.remove('rvd');noteForm(v)},
  rvcopy:()=>{const t=reviewText();(navigator.clipboard?.writeText(t)||Promise.reject()).then(()=>toast('Review copied'),()=>toast('Copy failed — select the text instead'))},
  bak:()=>dl(`journal-backup-${ymd(new Date())}.json`,JSON.stringify(S),'application/json'),
  clear:()=>{if(confirm('Delete ALL trades, notes and plans on this device?')){S=state({roll:S.roll,maxLoss:S.maxLoss});save();U.range='all';boot()}},
  prev:()=>shift(-1),next:()=>shift(1),tod:()=>{setMonth(Date.now());render()},
  day:v=>{U.range=U.range===v?'all':v;U.page=0;render()},
  rng:v=>{U.range=U.range===v?'all':v;U.page=0;render()},   // the Today card's period tiles; tap again for all time
  xf:v=>{const i=v.indexOf(':'),k=v.slice(0,i);let x=v.slice(i+1);if(k==='hour'||k==='wd')x=+x;
    if(k==='stat')U.stat=U.stat===x?'all':x;else if(U.x[k]===x)delete U.x[k];else U.x[k]=x;U.page=0;render()},
  xclr:k=>{if(k==='stat')U.stat='all';else if(k==='range')U.range='all';else delete U.x[k];U.page=0;render()},
  xall:()=>{U.stat='all';U.x={};if(/^\d{4}-/.test(U.range))U.range='all';U.page=0;render()},
  edit:v=>tradeForm(S.trades.find(t=>t.id===v)),
  del:v=>{if(confirm('Delete this trade?')){S.trades=S.trades.filter(t=>t.id!==v);save();render()}},
  pp:()=>{U.page--;render()},pn:()=>{U.page++;render()}
};
function shift(k){const d=new Date(U.month.y,U.month.m+k,1);U.month={y:d.getFullYear(),m:d.getMonth()};render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&ACT[b.dataset.a])ACT[b.dataset.a](b.dataset.v)});
// rows that act as buttons (cross-filters) answer Enter and Space too, and keep focus after the redraw
document.addEventListener('keydown',e=>{const b=e.target.closest('[role=button][data-a]');if(!b||(e.key!=='Enter'&&e.key!==' '))return;e.preventDefault();
  const sel=`[data-a="${b.dataset.a}"][data-v="${CSS.escape(b.dataset.v||'')}"]`,i=[...document.querySelectorAll(sel)].indexOf(b);b.click();document.querySelectorAll(sel)[i]?.focus()});
document.addEventListener('change',e=>{
  const k=e.target.dataset.f;if(!k)return;
  if(k==='roll'){S.roll=+e.target.value;save()}
  // a new max loss in Settings also moves today's plan, unless I set that day's line myself
  else if(k==='maxl'){const v=+e.target.value,d=pmDay(),p=S.plans[d],old=premkt(d).loss;S.maxLoss=v>0?r2(v):null;if(p&&p.loss===old)p.loss=premkt(d).loss;save()}
  else U[k]=e.target.value;
  U.page=0;render();
});
$('#file').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const txt=await f.text();
  if(!/\.json$/i.test(f.name))return importCSV(txt);
  try{
    const s=JSON.parse(txt);if(!Array.isArray(s.trades))throw 0;
    if(!confirm(`Replace everything here with this backup (${s.trades.length} trades)?`))return;
    S=state(s);save();boot();toast('Backup restored');
  }catch(x){toast('Not a valid backup file')}
});

function boot(){setMonth(S.trades.length?Math.max(...S.trades.map(t=>t.close)):Date.now());render()}
boot();
UI.planner('journal',[KEY],planRows);
// another ISIONXXX app can send you straight to an action here (REWIRE's LOG buttons): #do=<action> or a message
// 'today' (from TODAY's rings and timeline): drop any card filters and show just today, as a chip you can clear
function doAct(a){if(!/^\w+$/.test(a||''))return;if(a==='today'){U.x={};U.range=tday(Date.now());setMonth(Date.now());U.page=0;render();return}const b=document.querySelector(`[data-a="${a}"],[data-act="${a}"]`);if(b)b.click()}
addEventListener('message',e=>{if(e.origin===location.origin&&e.data&&e.data.isx==='do')doAct(e.data.act)});
{const m=/do=(\w+)/.exec(location.hash);if(m){history.replaceState(null,'',location.pathname+location.search);setTimeout(()=>doAct(m[1]),0)}}
/* ---------- today at a glance (shared hero, timeline and motion from ui.js) ---------- */
function heroToday(){
  if(!S.trades.length)return '';
  const t=tday(Date.now()),dd=new Date(t+'T12:00:00'),wkend=dd.getDay()===0||dd.getDay()===6;
  // net P&L per trading day; the week runs Monday to Sunday and the month is the calendar month, the same periods as
  // the range filter, so a tile can just switch the dashboard to that range
  const D={},N={};S.trades.forEach(x=>{const k=tday(x.close);D[k]=(D[k]||0)+net(x);N[k]=(N[k]||0)+1});
  const ws=(d=>{d.setDate(d.getDate()-(d.getDay()+6)%7);return ymd(d)})(new Date(dd)),T=S.trades.filter(x=>tday(x.close)===t).sort((a,b)=>a.close-b.close);
  const per=f=>{const k=Object.keys(D).filter(f);return{p:r2(k.reduce((a,d)=>a+D[d],0)),n:k.reduce((a,d)=>a+N[d],0),d:k.length,g:k.filter(d=>D[d]>0).length}};
  const td=per(d=>d===t),wk=per(d=>d>=ws&&d<=t),mo=per(d=>d.slice(0,7)===t.slice(0,7)&&d<=t),w=T.filter(x=>net(x)>0).length;
  const pl=(n,w)=>`${n} ${w}${n===1?'':'s'}`,tone=v=>v>0?'pos':v<0?'neg':'';
  const d0=v=>(v>0?'+':'')+usd0(v);   // whole dollars: the tiles have room for the figure, not the cents
  const tile=(k,label,x,sub)=>({label,value:x.n?d0(x.p):'—',tone:x.n?tone(x.p):'',sub,attrs:{'data-a':'rng','data-v':k,'aria-label':`${label}: ${x.n?usd(x.p,1):'no trades'}. Show ${label.toLowerCase()} below`},on:U.range===k});
  const noted=!!(S.notes[t]||'').trim();
  return UI.hero({key:'journal',title:'Today',sub:wkend?'Weekend · markets closed':noted?"Today's notes written ✓":T.length?"Today's notes still to write":'No trades yet today',
    stats:[tile('today','Today',td,td.n?`${pl(td.n,'trade')} · ${w} won`:wkend?'closed':'no trades yet'),
      tile('week','Week',wk,wk.d?`${pl(wk.d,'day')} · ${wk.g} green`:'no trades yet'),
      tile('month','Month',mo,mo.d?`${pl(mo.d,'day')} · ${mo.g} green`:'no trades yet')],
    action:{label:'+ Trade',attrs:{'data-a':'add'}},
    log:T.map(x=>({at:x.close,tag:`${x.side} ${x.contract}`,text:`×${x.qty} · ${usd(net(x),1)}`,tone:net(x)>0?'pos':net(x)<0?'neg':''}))});
}
{const r0=render;render=function(...a){r0.apply(this,a);UI.animate($('#app'));UI.animate($('#top'))};UI.animate($('#top'));UI.animate($('#app'))}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
