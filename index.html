<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070707">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JOURNAL">
<title>ISIONXXX // JOURNAL</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#070707;--panel:#0c0c0c;--line:#1c1c1c;--line2:#2c2c2c;
  --tx:#d9d5c8;--dim:#78746a;--amber:#ffb000;--green:#33ff66;--red:#ff4545;
  --f:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0 auto;max-width:1440px;padding:calc(env(safe-area-inset-top) + 14px) 16px 48px;background:var(--bg);color:var(--tx);font:13px/1.45 var(--f);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line2);border-radius:0;padding:7px 10px;outline:0}
button{cursor:pointer;font-size:12px;letter-spacing:.06em}
button:hover,select:hover{border-color:var(--amber);color:var(--amber)}
:focus-visible{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.pri{background:var(--amber);border-color:var(--amber);color:#000;font-weight:600}
.pri:hover{color:#000;filter:brightness(1.12)}
.pos{color:var(--green)}.neg{color:var(--red)}.dim{color:var(--dim)}.amb{color:var(--amber)}
.bgp{background:var(--green)}.bgn{background:var(--red)}.bgd{background:var(--line2)}
.r{text-align:right}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{font-weight:600;font-size:15px;letter-spacing:.14em}
.brand b{color:var(--amber)}
.cur{display:inline-block;width:.6em;height:1.05em;margin-left:6px;background:var(--amber);vertical-align:-2px;animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.cur{animation:none}}
.acts,.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{padding:14px 0}

.g{display:grid;gap:12px;margin-bottom:12px}
.g4{grid-template-columns:repeat(4,1fr)}.g21{grid-template-columns:2fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--panel);border:1px solid var(--line);padding:16px;min-width:0}
.h{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin-bottom:12px}
.h::before{content:'> ';color:var(--dim)}
.k{font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.big{font-size:22px;font-weight:600;margin:2px 0 8px}
.rowh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.empty{margin-bottom:12px;border-color:var(--amber)}
.empty p+p{margin-bottom:12px}

.gauge{display:block;width:150px;max-width:100%;margin:6px auto 10px}
.gauge path{fill:none;stroke-width:9}
.s0{stroke:var(--line2)}.sg{stroke:var(--green)}.sr{stroke:var(--red)}.sd{stroke:var(--dim)}
.gauge text{fill:var(--tx);font:600 17px var(--f)}
.lg{display:grid;grid-template-columns:14px 1fr auto 46px;align-items:center;padding:2px 0}
.lg em{font-style:normal;color:var(--dim);text-align:right}
.dot{display:inline-block;width:7px;height:7px}
.ev{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0}
.ev.rule{border-top:1px solid var(--line);margin-top:4px;padding-top:10px}
.hb{height:20px;background:#111;margin:2px 0 10px}
.hb i{display:block;height:100%}
.sec{font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;margin:12px 0 4px;padding-top:12px;border-top:1px solid var(--line)}
.sec.first{border:0;margin-top:0;padding-top:0}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,.9fr);gap:4px}
.dw{font-size:11px;color:var(--dim);text-align:center;padding:4px 0;letter-spacing:.08em;text-transform:uppercase}
.cd{min-height:66px;padding:6px;border:1px solid var(--line);background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;letter-spacing:0;color:var(--dim);overflow:hidden}
.cd b{font-size:12px}.cd em{font-style:normal;font-size:10px}
.cd.we,.cd.off{background:repeating-linear-gradient(135deg,#0a0a0a 0 6px,#111 6px 7px)}
.cd.off{border-color:transparent;opacity:.5}
.cd.p{background:rgba(51,255,102,.07);border-color:rgba(51,255,102,.3)}
.cd.n{background:rgba(255,69,69,.08);border-color:rgba(255,69,69,.3)}
.cd.now span{color:var(--amber)}
.cd.sel{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.cd.wk{border-style:dashed}
.calf{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}

.eqs{display:flex;gap:22px;flex-wrap:wrap}
.eqs div{display:flex;flex-direction:column;gap:2px}
.chart{display:block;width:100%;height:160px}
.chart *{vector-effect:non-scaling-stroke}
.chart .ln{fill:none;stroke-width:1.5}
.chart .z{stroke:var(--line2);stroke-dasharray:4 4}
.cg .ln{stroke:var(--green)}.cg .ar{fill:rgba(51,255,102,.1)}
.cr .ln{stroke:var(--red)}.cr .ar{fill:rgba(255,69,69,.1)}
.fp{fill:var(--green)}.fn{fill:var(--red)}.fa{fill:var(--amber)}
.nd{height:160px;display:grid;place-items:center;color:var(--dim);letter-spacing:.14em;font-size:11px}
.radar{display:block;width:100%;max-width:230px;margin:0 auto}
.radar .rg{fill:none;stroke:var(--line2)}
.radar .rv{fill:rgba(255,176,0,.16);stroke:var(--amber);stroke-width:1.5}
.radar text{fill:var(--dim);font:10px var(--f);letter-spacing:.08em}

.tw{overflow-x:auto}
table{width:100%;min-width:940px;border-collapse:collapse}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;font-weight:500;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
th.r,td.r{text-align:right}
td button{padding:2px 7px;font-size:11px}
footer{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px;font-size:11px;color:var(--dim)}
footer select,footer button{padding:3px 8px;font-size:11px}

dialog{background:var(--panel);color:var(--tx);border:1px solid var(--amber);padding:20px;width:min(560px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(0,0,0,.78)}
dialog h3{margin:0 0 14px;font-size:13px;letter-spacing:.14em;color:var(--amber)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
label input,label select,label textarea,dialog textarea{width:100%;font-size:13px;letter-spacing:0;text-transform:none;color:var(--tx)}
textarea{resize:vertical}
.fa2{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:14px}
.fa2 span{margin-right:auto}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:90vw;background:var(--panel);border:1px solid var(--amber);color:var(--amber);padding:8px 14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}

@media(max-width:1000px){.g4{grid-template-columns:1fr 1fr}.g21,.g3{grid-template-columns:1fr}}
@media(max-width:560px){
  body{padding-left:10px;padding-right:10px}
  .g4,.fgrid{grid-template-columns:1fr}
  .cd{min-height:50px;padding:3px}.cd em{display:none}.cd b{font-size:10px}
  .eqs{gap:14px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">ISIONXXX <b>//</b> JOURNAL<i class="cur"></i></div>
  <div class="acts">
    <button class="pri" data-a="add">+ TRADE</button>
    <button data-a="imp">IMPORT</button>
    <button data-a="note">NOTES</button>
    <input id="file" type="file" accept=".csv,.json,text/csv,application/json" hidden>
  </div>
</header>
<div class="bar">
  <select data-f="acct" aria-label="Account"></select>
  <select data-f="stat" aria-label="Outcome">
    <option value="all">All outcomes</option><option value="win">Wins</option><option value="loss">Losses</option>
  </select>
  <select data-f="range" aria-label="Range"></select>
  <span id="scope" class="dim"></span>
</div>
<main id="app"></main>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script>
'use strict';
const KEY='isx.journal.v1', PAGE=20;
// dollars per 1.00 point, per contract
const SPEC={NQ:20,MNQ:2,ES:50,MES:5,YM:5,MYM:.5,RTY:50,M2K:5,GC:100,MGC:10,SI:5000,SIL:1000,HG:25000,CL:1000,MCL:100,NG:10000};
const RANGES={today:'Today',week:'This week',month:'This month',all:'All time'};
const ALIAS={
  close:['closed','close','time','time (local)','exit time','exittime','exitedat','closed at','date','sold timestamp'],
  open:['opened','open','entry time','entrytime','enteredat','opened at','bought timestamp'],
  account:['account','account name','accountname'],
  contract:['contract','symbol','instrument','contractname'],
  side:['side','type','direction'],
  qty:['qty','quantity','size','contracts'],
  entry:['entry','entry price','entryprice','buy price','avg entry'],
  exit:['exit','exit price','exitprice','sell price','avg exit'],
  mult:['multiplier','point value','mult'],
  fee:['fee','fees'],comm:['comm','commission','commissions'],
  dur:['duration'],note:['note','notes','comment']
};

const $=s=>document.querySelector(s), dlg=$('#dlg');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const r2=v=>Math.round(v*100)/100;
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dtl=ms=>{const d=new Date(ms);return `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`};
const dlabel=s=>pd(s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const tfmt=ms=>new Date(ms).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const usd=(v,plus)=>(v<0?'-':plus&&v>0?'+':'')+'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const usd0=v=>(v<0?'-':'')+'$'+Math.abs(Math.round(v)).toLocaleString('en-US');
const px=v=>{const s=String(v);return s.includes('.')&&s.split('.')[1].length>2?s:v.toFixed(2)};
const cls=v=>v>0?'pos':v<0?'neg':'dim';
const dur=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}h ${m}m`:m?`${m}m ${x}s`:`${x}s`};
const root=c=>String(c).toUpperCase().trim().replace(/\d*!$/,'').replace(/[FGHJKMNQUVXZ]\d{1,2}$/,'');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
// net P&L: points x direction x qty x $/point, minus fee and commission
const net=t=>r2((t.exit-t.entry)*(t.side==='Short'?-1:1)*t.qty*t.mult-t.fee-t.comm);

/* ---------- state ---------- */
let S=load();
const U={acct:'all',stat:'all',range:'all',page:0,month:null};
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.trades))return {trades:s.trades,notes:s.notes||{},roll:s.roll??18}}catch(e){}
  return {trades:[],notes:{},roll:18};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Storage write failed — take a backup')}}
// trading day: anything at/after the roll hour belongs to the next date (Sunday 6 PM open -> Monday)
function tday(ms){const d=new Date(ms);if(S.roll&&d.getHours()>=S.roll)d.setDate(d.getDate()+1);return ymd(d)}
function setMonth(ms){const d=pd(tday(ms));U.month={y:d.getFullYear(),m:d.getMonth()}}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3200)}

function view(useRange=true){
  const today=tday(Date.now()),wk=s=>{const d=pd(s);d.setDate(d.getDate()-d.getDay());return ymd(d)};
  const inR=d=>U.range==='all'||(U.range==='today'?d===today:U.range==='week'?wk(d)===wk(today):U.range==='month'?d.slice(0,7)===today.slice(0,7):d===U.range);
  return S.trades.map(t=>({...t,pnl:net(t),day:tday(t.close)}))
    .filter(t=>(U.acct==='all'||t.account===U.acct)&&(U.stat==='all'||(U.stat==='win'?t.pnl>0:t.pnl<0))&&(!useRange||inR(t.day)))
    .sort((a,b)=>a.close-b.close);
}

function stats(T){
  const n=T.length,W=T.filter(t=>t.pnl>0),L=T.filter(t=>t.pnl<0);
  const gp=r2(W.reduce((s,t)=>s+t.pnl,0)),gl=r2(-L.reduce((s,t)=>s+t.pnl,0)),tot=r2(gp-gl);
  const D={};T.forEach(t=>{D[t.day]??={pnl:0,n:0};D[t.day].pnl+=t.pnl;D[t.day].n++});
  const dk=Object.keys(D).sort(),dp=dk.map(k=>r2(D[k].pnl));
  let eq=0,peak=0,mdd=0,run=0,lw=0,ll=0;const curve=[0],under=[0];
  T.forEach(t=>{
    eq+=t.pnl;peak=Math.max(peak,eq);mdd=Math.max(mdd,peak-eq);curve.push(r2(eq));under.push(r2(eq-peak));
    const s=Math.sign(t.pnl);run=!s?0:Math.sign(run)===s?run+s:s;lw=Math.max(lw,run);ll=Math.max(ll,-run);
  });
  mdd=r2(mdd);
  const mean=dp.length?dp.reduce((a,b)=>a+b,0)/dp.length:0;
  const dev=dp.length>1?Math.sqrt(dp.reduce((s,x)=>s+(x-mean)**2,0)/(dp.length-1)):0;
  const dn=dp.length>1?Math.sqrt(dp.reduce((s,x)=>s+Math.min(x,0)**2,0)/dp.length):0;
  const aw=W.length?gp/W.length:0,al=L.length?gl/L.length:0,pf=gl?gp/gl:gp?Infinity:null,wr=n?W.length/n*100:0;
  // score axes, each 0-100: payoff ratio (2.0 = full), win rate, profit factor (2.0 = full)
  const axes=[Math.min((al?aw/al:aw?2:0)/2,1)*100,wr,Math.min((pf||0)/2,1)*100];
  return {n,w:W.length,l:L.length,be:n-W.length-L.length,gp,gl,tot,aw,al,pf,wr,exp:n?tot/n:0,
    best:n?Math.max(...T.map(t=>t.pnl)):0,worst:n?Math.min(...T.map(t=>t.pnl)):0,
    dk,dp,vol:dk.map(k=>D[k].n),dw:dp.filter(x=>x>0).length,dl:dp.filter(x=>x<0).length,avgDay:mean,
    mdd,rec:mdd?tot/mdd:null,sharpe:dev?mean/dev*Math.sqrt(252):null,sortino:dn?mean/dn*Math.sqrt(252):null,
    lw,ll,run,curve,under,axes,score:Math.round((axes[0]+axes[1]+axes[2])/3)};
}

/* ---------- svg ---------- */
const ARC='M12 62A50 50 0 0 1 112 62', ND='<div class="nd">NO DATA_</div>';
function gauge(segs,label){
  let off=0;
  const arcs=segs.map(([v,c])=>{const a=`<path class="${c}" d="${ARC}" pathLength="100" stroke-dasharray="${(v*100).toFixed(2)} 100" stroke-dashoffset="${(-off*100).toFixed(2)}"/>`;off+=v;return a}).join('');
  return `<svg class="gauge" viewBox="0 0 124 70"><path class="s0" d="${ARC}"/>${arcs}<text x="62" y="60" text-anchor="middle">${label}</text></svg>`;
}
function line(vals,c){
  const w=600,h=160,p=6,n=vals.length;if(n<2)return ND;
  const lo=Math.min(0,...vals),hi=Math.max(0,...vals),rg=hi-lo||1;
  const x=i=>(p+i*(w-2*p)/(n-1)).toFixed(1),y=v=>(p+(hi-v)*(h-2*p)/rg).toFixed(1);
  const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  return `<svg class="chart ${c}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polygon class="ar" points="${x(0)},${y(0)} ${pts} ${x(n-1)},${y(0)}"/><line class="z" x1="0" x2="${w}" y1="${y(0)}" y2="${y(0)}"/><polyline class="ln" points="${pts}"/></svg>`;
}
function bars(vals,signed){
  const w=600,h=160,p=6,n=vals.length;if(!n)return ND;
  const lo=Math.min(0,...vals),hi=Math.max(0,...vals),rg=hi-lo||1,step=(w-2*p)/n,bw=Math.min(180,step*.7);
  const y=v=>p+(hi-v)*(h-2*p)/rg;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${vals.map((v,i)=>`<rect class="${signed?(v<0?'fn':'fp'):'fa'}" x="${(p+i*step+(step-bw)/2).toFixed(1)}" y="${Math.min(y(0),y(v)).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,Math.abs(y(v)-y(0))).toFixed(1)}"/>`).join('')}<line class="z" x1="0" x2="${w}" y1="${y(0)}" y2="${y(0)}"/></svg>`;
}
function radar(ax){
  const cx=100,cy=92,R=68,ang=[-90,30,150].map(a=>a*Math.PI/180);
  const pt=(i,f)=>`${(cx+Math.cos(ang[i])*R*f).toFixed(1)},${(cy+Math.sin(ang[i])*R*f).toFixed(1)}`;
  const poly=(c,fs)=>`<polygon class="${c}" points="${fs.map((f,i)=>pt(i,f)).join(' ')}"/>`;
  return `<svg class="radar" viewBox="0 0 200 160">${[.25,.5,.75,1].map(f=>poly('rg',[f,f,f])).join('')}${poly('rv',ax.map(v=>Math.max(v,3)/100))}<text x="100" y="14" text-anchor="middle">WIN/LOSS</text><text x="168" y="144" text-anchor="middle">WIN %</text><text x="30" y="144" text-anchor="middle">PF</text></svg>`;
}

/* ---------- render ---------- */
const lg=(dot,label,a,b='')=>`<div class="lg"><i class="dot ${dot}"></i><span>${label}</span><b>${a}</b><em>${b}</em></div>`;
const ev=(label,val,v)=>`<div class="ev"><span><i class="dot ${v>0?'bgp':v<0?'bgn':'bgd'}"></i> ${label}</span><b class="${v>0?'pos':v<0?'neg':''}">${val}</b></div>`;
const kv=(k,v)=>`<div><span class="k">${k}</span><b>${v}</b></div>`;
const fx=v=>v==null?'—':v.toFixed(2);

function calendar(){
  const D={};view(false).forEach(t=>{D[t.day]??={pnl:0,n:0};D[t.day].pnl+=t.pnl;D[t.day].n++});
  const {y,m}=U.month,lead=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),rows=Math.ceil((lead+dim)/7),today=tday(Date.now());
  const cell=(p,nn)=>`<b class="${cls(p)}">${usd0(p)}</b><em>${nn} trade${nn>1?'s':''}</em>`;
  let h='',tot=0,nT=0,wd=0,ld=0,td=0;
  for(let r=0;r<rows;r++){
    let ws=0,wn=0;
    for(let c=0;c<7;c++){
      const d=r*7+c-lead+1;
      if(d<1||d>dim){h+='<div class="cd off"></div>';continue}
      const k=`${y}-${pad(m+1)}-${pad(d)}`,x=D[k],p=x?r2(x.pnl):0;
      if(x){ws+=p;wn+=x.n;tot+=p;nT+=x.n;td++;if(p>0)wd++;else if(p<0)ld++}
      h+=`<button class="cd${c%6?'':' we'}${p>0?' p':p<0?' n':''}${k===U.range?' sel':''}${k===today?' now':''}" data-a="day" data-v="${k}"><span>${d}${S.notes[k]?' <i class="amb">*</i>':''}</span>${x?cell(p,x.n):''}</button>`;
    }
    h+=`<div class="cd wk">${wn?cell(r2(ws),wn):'<em>—</em>'}</div>`;
  }
  tot=r2(tot);
  return `<div class="card">
  <div class="rowh"><div><p class="h">P&amp;L calendar</p><div class="k">Total</div><div class="big ${cls(tot)}">${usd(tot)}</div></div>
   <div>Winning: <b class="pos">${wd}</b> &nbsp; Losing: <b class="neg">${ld}</b></div></div>
  <div class="cal">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat','Week'].map(d=>`<div class="dw">${d}</div>`).join('')}${h}</div>
  <div class="calf"><div><button data-a="prev" aria-label="Previous month">&lt;</button> <b>${new Date(y,m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})}</b> <button data-a="next" aria-label="Next month">&gt;</button> <button data-a="tod">TODAY</button></div>
   <span class="dim">${td} trading day${td===1?'':'s'} · ${nT} trade${nT===1?'':'s'}</span></div></div>`;
}

function table(T){
  const rows=[...T].reverse(),pages=Math.max(1,Math.ceil(rows.length/PAGE));
  U.page=Math.min(Math.max(U.page,0),pages-1);
  const body=rows.slice(U.page*PAGE,(U.page+1)*PAGE).map(t=>`<tr>
   <td>${tfmt(t.close)}</td><td class="dim">${esc(t.account)}</td><td><b>${esc(t.contract)}</b></td>
   <td>${t.side==='Short'?'&#9662; SHORT':'&#9652; LONG'}</td><td class="r">${t.qty}</td><td class="r">${px(t.entry)}</td><td class="r">${px(t.exit)}</td>
   <td>${dur((t.close-t.open)/1000)}</td><td class="r">${usd(t.fee)}</td><td class="r">${usd(t.comm)}</td>
   <td class="r"><b class="${cls(t.pnl)}">${usd(t.pnl,1)}</b></td>
   <td class="r">${t.note?`<span class="amb" title="${esc(t.note)}">*</span> `:''}<button data-a="edit" data-v="${t.id}">EDIT</button> <button data-a="del" data-v="${t.id}" aria-label="Delete trade">X</button></td></tr>`).join('');
  return `<div class="card"><div class="rowh"><p class="h">Trades</p><button data-a="csv">EXPORT CSV</button></div>
  <div class="tw"><table><thead><tr><th>Time (local)</th><th>Account</th><th>Contract</th><th>Side</th><th class="r">Qty</th><th class="r">Entry</th><th class="r">Exit</th><th>Duration</th><th class="r">Fee</th><th class="r">Comm</th><th class="r">P&amp;L (net)</th><th></th></tr></thead>
  <tbody>${body||'<tr><td colspan="12" class="dim">No trades in this view_</td></tr>'}</tbody></table></div>
  <div class="calf"><div><button data-a="pp">&lt;</button> Page <b>${U.page+1}</b> of ${pages} <button data-a="pn">&gt;</button></div><span class="dim">${rows.length} record${rows.length===1?'':'s'}</span></div></div>`;
}

function render(){
  const accts=[...new Set(S.trades.map(t=>t.account))].sort();
  if(U.acct!=='all'&&!accts.includes(U.acct))U.acct='all';
  const T=view(),s=stats(T),n=s.n,nd=s.dk.length,bd=nd-s.dw-s.dl;
  const pct=(a,b)=>b?Math.round(a/b*100)+'%':'0%';
  const pfT=s.pf==null?'—':s.pf===Infinity?'&infin;':s.pf.toFixed(2),gs=s.gp+s.gl,mx=Math.max(s.aw,s.al)||1;
  $('[data-f=acct]').innerHTML='<option value="all">All accounts</option>'+accts.map(a=>`<option${a===U.acct?' selected':''}>${esc(a)}</option>`).join('');
  $('[data-f=range]').innerHTML=Object.entries(RANGES).map(([k,v])=>`<option value="${k}"${k===U.range?' selected':''}>${v}</option>`).join('')+(U.range in RANGES?'':`<option value="${U.range}" selected>${dlabel(U.range)}</option>`);
  $('#scope').textContent=`Statistics for ${U.acct==='all'?'All Accounts':U.acct} — ${RANGES[U.range]||dlabel(U.range)}`+(nd?` · ${dlabel(s.dk[0])} → ${dlabel(s.dk[nd-1])}`:'');

  $('#app').innerHTML=`${S.trades.length?'':`<div class="card empty"><p class="h">No trades logged</p><p class="dim">Add a trade, import a CSV, or load the 10-trade sample to check the math.</p><button class="pri" data-a="add">+ TRADE</button> <button data-a="imp">IMPORT</button> <button data-a="sample">LOAD SAMPLE</button></div>`}
<section class="g g4">
 <div class="card"><p class="h">Wins</p><div class="k">Trades</div><div class="big">${n}</div>
  ${gauge([[n?s.w/n:0,'sg'],[n?s.be/n:0,'sd'],[n?s.l/n:0,'sr']],n?Math.round(s.wr)+'%':'—')}
  ${lg('bgp','Wins',s.w,pct(s.w,n))}${lg('bgd','Breakeven',s.be,pct(s.be,n))}${lg('bgn','Losses',s.l,pct(s.l,n))}</div>
 <div class="card"><p class="h">Day wins</p><div class="k">Trading days</div><div class="big">${nd}</div>
  ${gauge([[nd?s.dw/nd:0,'sg'],[nd?bd/nd:0,'sd'],[nd?s.dl/nd:0,'sr']],nd?pct(s.dw,nd):'—')}
  ${lg('bgp','Win days',s.dw,pct(s.dw,nd))}${lg('bgd','Breakeven days',bd,pct(bd,nd))}${lg('bgn','Loss days',s.dl,pct(s.dl,nd))}</div>
 <div class="card"><p class="h">Profit factor</p><div class="k">Factor</div><div class="big">${pfT}</div>
  ${gauge([[gs?s.gp/gs:0,'sg'],[gs?s.gl/gs:0,'sr']],pfT)}
  ${lg('bgp','Profits',usd(s.gp))}${lg('bgn','Losses',usd(s.gl))}${lg('bgd','Net',`<span class="${cls(s.tot)}">${usd(s.tot)}</span>`)}</div>
 <div class="card"><p class="h">Avg win/loss</p><div class="k">Average</div><div class="big ${cls(s.aw-s.al)}">${usd(s.aw-s.al)}</div>
  <div class="ev"><span>Win</span><b class="pos">${usd(s.aw,1)}</b></div><div class="hb"><i class="bgp" style="width:${(s.aw/mx*100).toFixed(1)}%"></i></div>
  <div class="ev"><span>Loss</span><b class="neg">${usd(-s.al)}</b></div><div class="hb"><i class="bgn" style="width:${(s.al/mx*100).toFixed(1)}%"></i></div>
  <div class="ev rule"><span class="dim">Expectancy / trade</span><b class="${cls(s.exp)}">${usd(s.exp)}</b></div></div>
</section>
<section class="g g21">
 ${calendar()}
 <div class="card"><p class="h">Evaluation</p>
  <div class="sec first">Performance</div>
  ${ev('Expectancy',usd(s.exp),s.exp)}${ev('Average per trading day',usd(s.avgDay),s.avgDay)}${ev('Biggest winner',usd(Math.max(s.best,0),1),Math.max(s.best,0))}${ev('Biggest loser',usd(Math.min(s.worst,0)),Math.min(s.worst,0))}
  <div class="sec">Risk</div>
  ${ev('Max drawdown',usd(-s.mdd),-s.mdd)}${ev('Recovery factor',s.rec==null?'—':s.rec.toFixed(2)+'&times;',s.rec)}${ev('Sharpe ratio',fx(s.sharpe),s.sharpe)}${ev('Sortino ratio',fx(s.sortino),s.sortino)}
  <div class="sec">Journal consistency</div>
  ${ev('Win days / loss days',`${s.dw} / ${s.dl}`,s.dw-s.dl)}${ev('Longest streak (W / L)',`${s.lw}W / ${s.ll}L`)}${ev('Current streak',s.run>0?s.run+'W':s.run<0?-s.run+'L':'—',s.run)}${ev('Last 5 trades',T.slice(-5).map(t=>`<i class="dot ${t.pnl>0?'bgp':t.pnl<0?'bgn':'bgd'}"></i>`).join(' ')||'—')}
 </div>
</section>
<section class="g g21">
 <div class="card"><div class="rowh"><div><p class="h">Equity curve</p><div class="big ${cls(s.tot)}">${usd(s.tot)}</div></div>
  <div class="eqs">${kv('Win rate',n?s.wr.toFixed(1)+'%':'—')}${kv('Profit factor',pfT)}${kv('Trades',n)}${kv('Best trade',`<span class="${cls(s.best)}">${usd(s.best,1)}</span>`)}${kv('Worst trade',`<span class="${cls(s.worst)}">${usd(s.worst,1)}</span>`)}</div></div>
  ${line(s.curve,s.tot<0?'cr':'cg')}</div>
 <div class="card"><p class="h">Performance</p><div class="k">Daily P&amp;L</div><div class="big ${cls(s.tot)}">${usd(s.tot)}</div>${bars(s.dp,1)}</div>
</section>
<section class="g g3">
 <div class="card"><p class="h">Score</p><div class="k">Composite 0–100</div><div class="big amb">${n?s.score:'—'}</div>${radar(s.axes)}</div>
 <div class="card"><p class="h">Volume</p><div class="k">Trades / day</div><div class="big">${n}</div>${bars(s.vol)}</div>
 <div class="card"><p class="h">Drawdown</p><div class="k">Max drawdown</div><div class="big ${cls(-s.mdd)}">${usd(-s.mdd)}</div>${line(s.under,'cr')}</div>
</section>
${table(T)}
<footer>Trading day rolls at <select data-f="roll" aria-label="Trading day rollover">${[0,16,17,18].map(h=>`<option value="${h}"${h===S.roll?' selected':''}>${h?pad(h)+':00':'midnight'}</option>`).join('')}</select> local · data lives on this device only
 <button data-a="bak">BACKUP JSON</button><button data-a="clear">CLEAR ALL</button></footer>`;
}

/* ---------- dialogs ---------- */
function tradeForm(t){
  const last=S.trades[S.trades.length-1]||{},now=Date.now();
  const d=t||{account:last.account||'',contract:last.contract||'NQ',side:'Long',qty:1,entry:'',exit:'',open:now-60000,close:now,mult:'',fee:last.fee??0,comm:last.comm??0,note:''};
  dlg.innerHTML=`<form id="tf"><h3>${t?'EDIT':'NEW'} TRADE</h3>
  <div class="fgrid">
   <label>Account<input name="account" list="accts" required value="${esc(d.account)}"></label>
   <label>Contract<input name="contract" required value="${esc(d.contract)}" placeholder="NQZ6"></label>
   <label>Side<select name="side"><option${d.side==='Long'?' selected':''}>Long</option><option${d.side==='Short'?' selected':''}>Short</option></select></label>
   <label>Qty<input name="qty" type="number" min="1" step="1" required value="${d.qty}"></label>
   <label>Entry<input name="entry" type="number" step="any" required value="${d.entry}"></label>
   <label>Exit<input name="exit" type="number" step="any" required value="${d.exit}"></label>
   <label>Opened<input name="open" type="datetime-local" step="1" required value="${dtl(d.open)}"></label>
   <label>Closed<input name="close" type="datetime-local" step="1" required value="${dtl(d.close)}"></label>
   <label>$ per point<input name="mult" type="number" min="0" step="any" required value="${d.mult}"></label>
   <label>Fee<input name="fee" type="number" min="0" step="any" value="${d.fee}"></label>
   <label>Commission<input name="comm" type="number" min="0" step="any" value="${d.comm}"></label>
  </div>
  <label>Note<textarea name="note" rows="3">${esc(d.note||'')}</textarea></label>
  <datalist id="accts">${[...new Set(S.trades.map(x=>x.account))].map(a=>`<option value="${esc(a)}">`).join('')}</datalist>
  <div class="fa2"><span id="pv"></span><button type="button" data-a="x">CANCEL</button><button class="pri">SAVE</button></div></form>`;
  const f=$('#tf'),e=f.elements;let touched=!!t;
  const read=()=>({account:e.account.value.trim(),contract:e.contract.value.trim().toUpperCase(),side:e.side.value,qty:+e.qty.value,entry:+e.entry.value,exit:+e.exit.value,
    open:new Date(e.open.value).getTime(),close:new Date(e.close.value).getTime(),mult:+e.mult.value,fee:+e.fee.value||0,comm:+e.comm.value||0,note:e.note.value.trim()});
  const sync=ev=>{
    if(ev&&ev.target.name==='mult')touched=true;
    if(!touched)e.mult.value=SPEC[root(e.contract.value)]??'';
    const v=read(),ok=e.entry.value!==''&&e.exit.value!==''&&v.mult>0&&v.qty>0;
    $('#pv').innerHTML=ok?`NET <b class="${cls(net(v))}">${usd(net(v),1)}</b>`:'';
  };
  f.addEventListener('input',sync);sync();
  f.addEventListener('submit',ev=>{
    ev.preventDefault();const v=read();
    if(!(v.close>=v.open)){$('#pv').innerHTML='<span class="neg">Closed must be after opened</span>';return}
    if(t)Object.assign(S.trades.find(x=>x.id===t.id),v);else S.trades.push({id:uid(),...v});
    save();dlg.close();setMonth(v.close);render();
  });
  dlg.showModal();
}
function noteForm(day){
  dlg.innerHTML=`<form id="nf"><h3>NOTES // ${dlabel(day)}</h3><textarea name="n" rows="10" placeholder="Plan. Execution. What to repeat. What to cut.">${esc(S.notes[day]||'')}</textarea>
  <div class="fa2"><button type="button" data-a="x">CANCEL</button><button class="pri">SAVE</button></div></form>`;
  $('#nf').addEventListener('submit',ev=>{ev.preventDefault();const v=ev.target.elements.n.value.trim();if(v)S.notes[day]=v;else delete S.notes[day];save();dlg.close();render()});
  dlg.showModal();
}

/* ---------- import / export ---------- */
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function parseCSV(txt){
  const rows=[];let row=[],f='',q=false;
  const end=()=>{row.push(f);f='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]};
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;end()}else f+=c}
  end();return rows;
}
const num=s=>parseFloat(String(s).replace(/[$,+\s]/g,''));
// ISO, "2026-10-08 00:01:06", or US "10/08/2026 00:01:06" (Tradovate), all read as local time
const ts=s=>{
  const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})[ T](\d{1,2}):(\d\d)(?::(\d\d))?\s*(AM|PM)?$/i.exec(s.trim());
  if(m){let h=+m[4];if(m[7])h=h%12+(/pm/i.test(m[7])?12:0);return new Date(+m[3],m[1]-1,+m[2],h,+m[5],+(m[6]||0)).getTime()}
  return Date.parse(/^\d{4}-\d\d-\d\d \d/.test(s)?s.replace(' ','T'):s);
};
const secs=s=>{if(!s)return 0;if(/^[\d.]+$/.test(s))return +s;let x=0;s.replace(/([\d.]+)\s*([hms])/gi,(_,v,u)=>{x+=v*{h:3600,m:60,s:1}[u.toLowerCase()]});return x};
function importCSV(txt){
  const rows=parseCSV(txt.replace(/^\uFEFF/,''));if(rows.length<2)return toast('No rows found');
  const H=rows[0].map(h=>h.trim().toLowerCase()),c={};
  for(const k in ALIAS)c[k]=H.findIndex(h=>ALIAS[k].includes(h));
  // Tradovate "Performance" export: one row per round trip as a buy and a sell, no side column.
  // Whichever fill came first is the entry: bought first = long, sold first = short.
  const P=['buyprice','sellprice','boughttimestamp','soldtimestamp'].map(h=>H.indexOf(h)),perf=P.every(i=>i>=0);
  const miss=['close','contract','entry','exit'].filter(k=>c[k]<0&&!(perf&&k!=='contract'));
  if(miss.length)return toast('Missing column: '+miss.join(', '));
  // no account column: file the trades under the account you used last, if there is one
  let acct='DEFAULT';
  if(c.account<0){const lt=S.trades.reduce((a,t)=>!a||t.close>a.close?t:a,null);
    const v=prompt('This file has no account column. Account for these trades:',lt?lt.account:'DEFAULT');
    if(v===null)return;acct=v.trim()||'DEFAULT'}
  const key=t=>[t.close,t.account,t.contract,t.side,t.qty,t.entry,t.exit].join('|'),seen=new Set(S.trades.map(key)),unk=new Set();
  let add=0,skip=0,last=0;
  rows.slice(1).forEach(r=>{
    const g=k=>c[k]<0?'':(r[c[k]]||'').trim();
    const contract=g('contract').toUpperCase();let close,entry,exit,op,side;
    if(perf){
      const[bp,sp,bt,st]=P.map(i=>(r[i]||'').trim()),b=ts(bt),s=ts(st),short=s<b;
      side=short?'Short':'Long';entry=num(short?sp:bp);exit=num(short?bp:sp);op=Math.min(b,s);close=Math.max(b,s);
    }else{close=ts(g('close'));entry=num(g('entry'));exit=num(g('exit'));op=ts(g('open'));side=/short|sell/i.test(g('side'))?'Short':'Long'}
    if(!isFinite(close)||!isFinite(entry)||!isFinite(exit)||!contract){skip++;return}
    const m=num(g('mult')),sp=SPEC[root(contract)];
    if(!(m>0)&&!sp)unk.add(root(contract));
    const t={id:uid(),account:g('account')||acct,contract,side,qty:Math.abs(num(g('qty')))||1,entry,exit,
      open:isFinite(op)?op:close-secs(g('dur'))*1000,close,mult:m>0?m:sp||1,fee:Math.abs(num(g('fee')))||0,comm:Math.abs(num(g('comm')))||0,note:g('note')};
    if(seen.has(key(t))){skip++;return}
    seen.add(key(t));S.trades.push(t);add++;last=Math.max(last,close);
  });
  if(add){save();setMonth(last);render()}
  toast(`Imported ${add} · skipped ${skip}`+(unk.size?` · set $/point for ${[...unk].join(', ')}`:''));
}
function exportCSV(){
  const T=view();if(!T.length)return toast('Nothing to export');
  const q=v=>{v=String(v??'');return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v};
  const rows=[['closed','opened','account','contract','side','qty','entry','exit','multiplier','fee','comm','pnl_net','note'],
    ...T.map(t=>[dtl(t.close),dtl(t.open),t.account,t.contract,t.side,t.qty,t.entry,t.exit,t.mult,t.fee,t.comm,t.pnl,t.note||''])];
  dl(`journal-${ymd(new Date())}.csv`,rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv');
}
function sample(){
  // the ten GCZ6 trades from the reference screenshot: day, hour, minute, entry, exit, seconds held
  [[27,23,29,4229,4229.4,154],[27,23,32,4229.4,4230.2,146],[27,23,40,4226,4227.2,275],[27,23,46,4228.9,4224.9,305],[27,23,58,4227,4230,567],
   [28,0,59,4230.4,4228.4,3588],[28,1,0,4227.8,4228.2,34],[28,1,1,4228.7,4228.8,56],[28,1,3,4229.4,4229.4,36],[28,1,4,4229.4,4228.2,21]]
  .forEach(([d,h,mi,en,ex,s])=>{const close=new Date(2026,8,d,h,mi).getTime();
    S.trades.push({id:uid(),account:'MFFUEVREOD200440155',contract:'GCZ6',side:'Long',qty:1,entry:en,exit:ex,open:close-s*1000,close,mult:100,fee:3,comm:1,note:''})});
  save();boot();
}

/* ---------- events ---------- */
const ACT={
  add:()=>tradeForm(),imp:()=>$('#file').click(),x:()=>dlg.close(),sample,csv:exportCSV,
  note:()=>noteForm(U.range in RANGES?tday(Date.now()):U.range),
  bak:()=>dl(`journal-backup-${ymd(new Date())}.json`,JSON.stringify(S),'application/json'),
  clear:()=>{if(confirm('Delete ALL trades and notes on this device?')){S={trades:[],notes:{},roll:S.roll};save();U.range='all';boot()}},
  prev:()=>shift(-1),next:()=>shift(1),tod:()=>{setMonth(Date.now());render()},
  day:v=>{U.range=U.range===v?'all':v;U.page=0;render()},
  edit:v=>tradeForm(S.trades.find(t=>t.id===v)),
  del:v=>{if(confirm('Delete this trade?')){S.trades=S.trades.filter(t=>t.id!==v);save();render()}},
  pp:()=>{U.page--;render()},pn:()=>{U.page++;render()}
};
function shift(k){const d=new Date(U.month.y,U.month.m+k,1);U.month={y:d.getFullYear(),m:d.getMonth()};render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&ACT[b.dataset.a])ACT[b.dataset.a](b.dataset.v)});
document.addEventListener('change',e=>{
  const k=e.target.dataset.f;if(!k)return;
  if(k==='roll'){S.roll=+e.target.value;save()}else U[k]=e.target.value;
  U.page=0;render();
});
$('#file').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const txt=await f.text();
  if(!/\.json$/i.test(f.name))return importCSV(txt);
  try{
    const s=JSON.parse(txt);if(!Array.isArray(s.trades))throw 0;
    if(!confirm(`Replace everything here with this backup (${s.trades.length} trades)?`))return;
    S={trades:s.trades,notes:s.notes||{},roll:s.roll??18};save();boot();toast('Backup restored');
  }catch(x){toast('Not a valid backup file')}
});

function boot(){setMonth(S.trades.length?Math.max(...S.trades.map(t=>t.close)):Date.now());render()}
boot();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
